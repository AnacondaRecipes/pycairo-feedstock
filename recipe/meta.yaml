{% set name = "pycairo" %}
{% set version = "1.29.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pygobject/pycairo/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3e69fff74fe64f5ba2dfa31f67c6bdf26413342574047437d2ac520d35e9a489
  patches:  # [win]
    - patches/exclude-failing-win-test.patch  # [win]

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - python
    - pkg-config
    - meson >=0.64.0
    - ninja-base >=1.8.2  # [not win]
  host:
    - pip
    - python
    - meson-python >=0.16.0
    - poetry-core >=2.2
    - cairo {{ cairo }}
    # No glib here: pycairo binds cairo only, and the installed cairo.pc has no
    # Requires line, so a host glib only injected an unused libglib run export.
    - pytest >=8.3.0,<10  # for testing during the build
    - flake8 >=7.0.0,<8  # for testing during the build
  run:
    # cairo's run export from the host requirement supplies the constraint
    # (cairo >=1.18.6,<2.0a0); a second hard pin here duplicated the dep.
    - python

test:
  imports:
    - cairo
  requires:
    - pkg-config
  commands:
    # verify the pkgconfig files get installed
    - test -f $PREFIX/lib/pkgconfig/py3cairo.pc  # [unix]
    - if not exist %LIBRARY_LIB%\\pkgconfig\\py3cairo.pc exit 1  # [win]
    # verify that the header can be located through pkg-config
    - test -f `pkg-config --variable=includedir --dont-define-prefix py3cairo`/pycairo/py3cairo.h  # [unix]
    - for /f "usebackq tokens=*" %%a in (`pkg-config --variable=includedir --dont-define-prefix py3cairo`) do if not exist "%%a/pycairo/py3cairo.h" exit 1  # [win]

about:
  home: https://www.cairographics.org/pycairo
  license: LGPL-2.1-only OR MPL-1.1
  license_file:
    - COPYING
    - COPYING-LGPL-2.1
    - COPYING-MPL-1.1
  license_family: Other
  summary: Python bindings for the Cairo graphics library.
  description: |
    Pycairo is a Python module providing bindings for the cairo graphics library.
    The Pycairo bindings are designed to match the cairo C API as closely as possible, and to
    deviate only in cases which are clearly better implemented in a more 'Pythonic' way.
  dev_url: https://github.com/pygobject/pycairo
  doc_url: https://pycairo.readthedocs.io

extra:
  recipe-maintainers:
    - pkgw
  skip-lints:
    - python_build_tools_in_host
